name: Poll for upstream updates
on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * *'

jobs:
  poll-updates:
    name: Execute merge-upstream
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/merge-upstream.yml
    with:
      source: https://git.sr.ht/~tsileo/microblog.pub
      source_branch: v2
      target_branch: v2
